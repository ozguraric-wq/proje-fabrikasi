name: Proje Fabrikası demo yayını
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak dosyalarını al
        uses: actions/checkout@v6
      - name: Yayın dosyalarını doğrula
        run: |
          test -s dist/index.html
          test -s dist/assets/site.css
          test -s dist/assets/site.js
          test -s dist/assets/access.css
          test -s dist/assets/access.js
          test -s dist/assets/ratel-dijital.webp
          test -s dist/belgeler/Proje_Fabrikasi_Konsept_ve_Ekler_V4.docx
          test -s dist/belgeler/Proje_Fabrikasi_Konsept_ve_Ekler_V4.pdf
          node --check dist/assets/site.js
          node --check dist/assets/access.js
      - name: GitHub Pages hazırlığı
        uses: actions/configure-pages@v5
      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Demoyu yayınla
        id: deployment
        uses: actions/deploy-pages@v4
